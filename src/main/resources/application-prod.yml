## 운영(prod) 프로파일 설정. 값은 전부 환경변수로 주입하며, 실제 값은 이 파일에 직접 쓰지 않는다.
## EC2에서 `docker run --env-file .env ...`로 아래 환경변수들을 채워서 실행한다. (.env는 git에 올리지 않음)

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

app:
  storage:
    type: s3
    s3:
      region: ${AWS_REGION}
      bucket: ${S3_BUCKET}
      base-url: ${S3_BASE_URL}

  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD_HASH}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
